syntax = "proto3";

import "pb/student.proto";

package test;

option go_package = "github.com/mvk12/grpc-demo/pb";

message Test {
  int32 id = 1;
  string title = 2;
  string description = 3;
}

message Question {
  int32 id = 1;
  string question = 2;
  string answer = 3;
  int32 test_id = 4;
}

message GetTestRequest {
  int32 id = 1;
}

message TestResponse {
  int32 id = 1;
}

message SimpleStreamResponse {
  bool ok = 1;
}

message EnrollmentRequest {
  int32 student_id = 1;
  int32 test_id = 2;
}

message GetStudentsPerTestRequest {
  int32 test_id = 1;
}

service TestService {
  rpc GetTest(GetTestRequest) returns (Test);
  rpc CreateTest(Test) returns (TestResponse);
  rpc CreateQuestions(stream Question) returns (SimpleStreamResponse);
  rpc EnrollStudents(stream EnrollmentRequest) returns (SimpleStreamResponse);
  rpc GetStudentsPerTest(GetStudentsPerTestRequest) returns (stream student.Student);
}